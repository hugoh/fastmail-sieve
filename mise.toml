[tools]
hk = "2.13.0"
uv = "0.13.9"
jactionlint = "2.6.0"
pinact = "5.0.2"
ghalint = "1.6.0"
gitleaks = "8.30.1"
typos = "1.52.2"
rumdl = "0.3.5"
biome = "2.6.8"
tombi = "1.11.3"
"github:owenlamont/ryl" = "0.30.0"
ruff = "0.17.6"
ty = "0.0.107"
"pipx:twine" = "7.0.0"

[tasks.test]
description = "Run the test suite"
run = "uv run coverage run -m unittest discover -s tests -t . && uv run coverage report"

[tasks.package-check]
description = "Build the sdist and wheel, validate the metadata and install the wheel in a clean env"
run = """
set -eu
rm -rf dist
uv build --out-dir dist
twine check --strict dist/*
uv run --isolated --no-project --with dist/*.whl python -c "import importlib.metadata as m; print(m.version('fastmail-sieve'))"
"""
