[project]
name = "fastmail-sieve"
description = "Keep Fastmail Sieve rules in git: lint, explain, migrate and sync. Unofficial."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Hugo Haas" },
]
keywords = ["email", "fastmail", "filters", "jmap", "sieve"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email :: Filters",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.1,<9",
  "keyring>=25",
  "requests>=2.32,<3",
  "rich>=14,<15",
  "sievelib>=1.6,<1.7",
  "urllib3>=2.2,<3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/hugoh/fastmail-sieve"
Issues = "https://github.com/hugoh/fastmail-sieve/issues"
Repository = "https://github.com/hugoh/fastmail-sieve"

[project.scripts]
fastmail-sieve = "fastmail_sieve.cli:main"
fmsieve = "fastmail_sieve.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.6",
  "responses>=0.25",
  "ruff>=0.17.5",
  "ty>=0.0.104",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/fastmail_sieve"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["src/fastmail_sieve"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
