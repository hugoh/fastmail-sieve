---
name: semantic-pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pr:
    uses: hugoh/gh-workflows/.github/workflows/semantic-pr.yml@6bd2cbe7a9a1331de78dd565593a38808945bb23 # v1.40.24
    permissions:
      pull-requests: read
