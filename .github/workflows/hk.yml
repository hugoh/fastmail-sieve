---
name: hk

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@30ea88e8815001f26c86977d2ba60ddddebf42e0 # v1.40.23
    permissions:
      contents: read
      packages: read
      statuses: write
