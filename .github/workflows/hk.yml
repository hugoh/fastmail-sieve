---
name: hk

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hk:
    uses: hugoh/gh-workflows/.github/workflows/hk.yml@6bd2cbe7a9a1331de78dd565593a38808945bb23 # v1.40.24
    permissions:
      contents: read
      packages: read
      statuses: write
